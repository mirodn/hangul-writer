name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn lint-test
      - run: yarn test
      # coverage upload is optional: it only runs once the CODECOV_TOKEN secret is set
      - uses: codecov/codecov-action@v7
        if: env.CODECOV_TOKEN != ''
        with:
          token: ${{ env.CODECOV_TOKEN }}

  # Publishes to npm with Trusted Publishing (OIDC), so no npm token is needed.
  # Stays off until the repository variable RELEASE_ENABLED is set to "true".
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm Trusted Publishing and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Release
        run: yarn semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
