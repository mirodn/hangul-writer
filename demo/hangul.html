<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<title>Hangul Writer</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>

		<h1 class="title">Hangul Writer</h1>
		<form class="js-char-form char-form">
			<label>
				Character
				<input type="text" class="js-char char-input" size="1" maxlength="1" value="ㄱ" list="hangul-jamo" />
			</label>
			<datalist id="hangul-jamo"></datalist>
			<button type="submit">Update</button>
		</form>
		<div class="actions">
			<button class="js-toggle">Show/hide</button>
			<button class="js-toggle-hint">Outline on/off</button>
			<button class="js-animate">Animate</button>
			<button class="js-quiz">Quiz yourself</button>
		</div>

		<div id="target"></div>

		<p class="js-feedback" aria-live="polite"></p>

		<script type="application/javascript" src="../dist/hangul-writer.js"></script>
		<script type="application/javascript" src="hangul.js"></script>

	</body>
</html>
